<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Weather Prediction</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🌦️ Panchayat Weather AI
    </div>

    <div class="nav-links">

        <a href="index.html">Dashboard</a>
        <a href="forecast.html">Forecast</a>
        <a href="alerts.html">Alerts</a>
        <a href="recommendations.html">Recommendations</a>
        <a href="ai-prediction.html">AI Prediction</a>

    </div>

</nav>


<section class="page">

    <h1>🤖 AI Weather Prediction</h1>

    <p class="page-intro">
        Enter weather conditions and let the machine
        learning model predict rainfall.
    </p>


    <div class="prediction-container">

        <form id="predictionForm">

            <label>Temperature (°C)</label>

            <input
                type="number"
                id="temperatureInput"
                step="0.1"
                required
            >


            <label>Humidity (%)</label>

            <input
                type="number"
                id="humidityInput"
                step="0.1"
                required
            >


            <label>Wind Speed (km/h)</label>

            <input
                type="number"
                id="windInput"
                step="0.1"
                required
            >


            <label>Cloud Cover (%)</label>

            <input
                type="number"
                id="cloudInput"
                step="0.1"
                required
            >


            <button type="submit">
                🔮 Predict Rainfall
            </button>

        </form>


        <div id="predictionResult"
             class="prediction-result">

            Enter values and click
            <strong>Predict Rainfall</strong>.

        </div>

    </div>

</section>


<footer>
    <p>© 2026 Panchayat Weather AI</p>
</footer>


<script src="js/script.js"></script>

</body>
</html>
